target-version = "py312"
line-length = 100
indent-width = 4

[lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "UP",     # pyupgrade (Python 3.12 modern syntax)
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "ANN",    # flake8-annotations (strict typing)
    "D",      # pydocstyle (docstrings)
    "RUF",    # Ruff-specific rules
]

ignore = [
    "ANN401", # Dynamically typed expressions (typing.Any)
]

[lint.pydocstyle]
convention = "google"

[lint.per-file-ignores]
"__init__.py" = ["D100", "D104"]
"**/__init__.py" = ["D100", "D104"]
"tests/*" = ["D", "ANN"]
"tests/**" = ["D", "ANN"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
